project:
  type: website
  resources:
    - assets
    - "*.pdf"  # CV PDF fetched from ConnorB/CV during CI build

execute:
  freeze: auto
  
# Metadata stuff
pagetitle: "{{< meta title >}} | Connor Brown"
author-meta: "Connor Brown"
# Link-preview image for every page. JPG at 1200x630 so LinkedIn and other
# apps that skip WebP still show it; set image/image-alt on a page to override.
image: assets/images/social-preview.jpg
image-alt: "Connor standing in Kings Creek doing sensor maintenance"

website:
  site-url: https://connorb.github.io
  favicon: assets/favicon/favicon.ico
  twitter-card:
    creator: "@eco_conn"
    site: "@eco_conn"
  open-graph: true
  llms-txt: true
  search: false
  # Navbar with social links
  navbar:
    left:
      - text: About
        href: index.qmd
      - text: Publications
        href: publications.qmd
      - text: Software
        href: software.qmd
      - text: CV
        href: cv.qmd
      - text: Teaching
        href: teaching.qmd
  # Footer with same social links
  page-footer:
    left: |
      © <span id="footer-year">2026</span> Connor Brown
      <script>document.getElementById("footer-year").textContent = new Date().getFullYear();</script>
    right: |
      {{< social-links class="footer-social" >}}
# icon and social-links shortcodes; edit social profiles in this Lua file.
shortcodes:
  - _shortcodes/icons.lua
format:
  html:
    theme:
      - darkly
      - assets/css/custom.scss
    css: assets/css/styles.css
    toc: true
    canonical-url: true
    include-in-header:
      - _includes/favicon.html
      - _includes/site-verification.html
      - _includes/fonts.html
      - _includes/structured-data.html
      - _includes/goatcounter.html
